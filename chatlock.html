<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمز الدخول 🔒</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fa709a 100%);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
}
.lockBox {
  background: white; border-radius: 24px; padding: 34px 26px;
  box-shadow: 0 14px 30px rgba(0,0,0,0.25); text-align: center; max-width: 340px; width: 100%;
}
.lockIcon { font-size: 44px; margin-bottom: 10px; }
.lockTitle { font-size: 18px; font-weight: bold; color: #c9527a; margin-bottom: 6px; }
.lockHint { font-size: 13px; color: #999; margin-bottom: 22px; }
.dateInputs { display: flex; gap: 8px; justify-content: center; direction: ltr; margin-bottom: 18px; }
.dateInputs input {
  width: 60px; text-align: center; font-size: 20px; font-weight: bold;
  padding: 12px 4px; border-radius: 12px; border: 2px solid #ffd6e6; color: #c9527a;
}
.dateInputs input:focus { outline: none; border-color: #fa709a; }
.dateInputs .sep { font-size: 22px; color: #c9527a; align-self: center; }
.unlockBtn {
  background: linear-gradient(135deg, #ff8fae, #fa709a); color: white; border: none;
  padding: 13px 30px; border-radius: 30px; font-size: 15px; font-weight: bold;
  cursor: pointer; box-shadow: 0 6px 16px rgba(250,112,154,0.4); width: 100%;
}
.errMsg { color: #e04545; font-size: 13px; margin-top: 12px; min-height: 18px; font-weight: bold; }
.backLink { display:block; margin-top: 18px; color: #c9527a; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>

<div class="lockBox">
  <div class="lockIcon">🔒</div>
  <div class="lockTitle">قبل لا تدخلين... 💭</div>
  <div class="lockHint">اكتبي تاريخ أول ما تعارفنا (يوم / شهر / سنة)</div>
  <div class="dateInputs">
    <input type="number" id="dayInput" placeholder="يوم" maxlength="2">
    <span class="sep">/</span>
    <input type="number" id="monthInput" placeholder="شهر" maxlength="2">
    <span class="sep">/</span>
    <input type="number" id="yearInput" placeholder="سنة" maxlength="4">
  </div>
  <button class="unlockBtn" onclick="checkCode()">فتح 🔓</button>
  <div class="errMsg" id="errMsg"></div>
  <a href="tuhibbeeni.html" class="backLink">→ رجوع</a>
</div>

<script>
function checkCode() {
  const day = document.getElementById('dayInput').value;
  const month = document.getElementById('monthInput').value;
  const year = document.getElementById('yearInput').value;
  const errMsg = document.getElementById('errMsg');

  if (day === '19' && month === '6' && year === '2025') {
    window.location.href = 'https://jmsksks6sourc.pythonanywhere.com/';
  } else {
    errMsg.textContent = 'التاريخ مو صحيح، حاولي مرة ثانية 🥺';
  }
}
</script>
</body>
  </html>
