<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سؤال بسيط 💭</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: hidden; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fa709a 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  overflow: hidden;
}

.heart { position: fixed; top: -10%; font-size: 22px; color: rgba(255,255,255,0.6); animation: fall linear infinite; pointer-events: none; z-index: 0; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

.backBtn {
  position: fixed; top: 16px; right: 16px;
  color: white; text-decoration: none; font-size: 13px; font-weight: bold;
  background: rgba(255,255,255,0.25); padding: 8px 16px; border-radius: 20px; z-index: 10;
}

.scene {
  position: relative; z-index: 1; text-align: center;
  display: flex; flex-direction: column; align-items: center;
  max-width: 380px; width: 100%;
}

.bunnyBig {
  position: relative; width: 130px; height: 130px; margin-bottom: 10px;
  animation: bunnyBob 2s ease-in-out infinite;
}
@keyframes bunnyBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.bb-ear { position:absolute; top:-38px; width: 26px; height: 60px; background: #ffffff; border: 3px solid #e8a0b5; border-radius: 50% 50% 45% 45%; }
.bb-ear::after { content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:13px; height:36px; background:#ffc4d6; border-radius:50%; }
.bb-ear.left { left: 16px; transform: rotate(-14deg); }
.bb-ear.right { right: 16px; transform: rotate(14deg); }
.bb-head { position:absolute; top:14px; left:50%; transform:translateX(-50%); width: 100px; height: 92px; background: #ffffff; border: 3px solid #e8a0b5; border-radius: 50%; }
.bb-eye { position:absolute; top: 40px; width: 12px; height: 15px; background:#5a3d28; border-radius:50%; transition: all 0.2s; }
.bb-eye.left { left: 30px; }
.bb-eye.right { right: 30px; }
.bb-eye.happy { height: 4px; border-radius: 0 0 12px 12px; background: transparent; border-bottom: 4px solid #5a3d28; top: 45px; }
.bb-blush { position:absolute; top: 58px; width: 16px; height: 10px; background:#ffb0c6; border-radius:50%; opacity:0.85; }
.bb-blush.left { left: 12px; }
.bb-blush.right { right: 12px; }
.bb-nose { position:absolute; top: 56px; left:50%; transform: translateX(-50%); width: 10px; height: 8px; background:#e88ba3; border-radius:50%; }
.bb-mouth { position:absolute; top: 65px; left:50%; transform: translateX(-50%); width: 20px; height: 10px; border-bottom: 3px solid #a85a5a; border-radius: 50%; transition: all 0.3s; }
.bb-mouth.big { width: 26px; height: 16px; border-bottom-width: 4px; }

.question {
  color: white; font-size: 26px; font-weight: bold;
  text-shadow: 0 3px 10px rgba(0,0,0,0.25);
  margin: 12px 0 30px;
}

.btnRow {
  display: flex; gap: 20px; align-items: center; justify-content: center;
  position: relative; min-height: 70px;
}
.answerBtn {
  border: none; border-radius: 40px; font-weight: bold; cursor: pointer;
  transition: all 0.35s cubic-bezier(0.34,1.4,0.64,1);
  box-shadow: 0 8px 18px rgba(0,0,0,0.2);
}
.noBtn {
  background: linear-gradient(135deg, #ff6b6b, #e04545);
  color: white; font-size: 20px; padding: 16px 36px;
}
.yesBtn {
  background: linear-gradient(135deg, #4caf7d, #2e9e5b);
  color: white; font-size: 20px; padding: 16px 36px;
}
.noBtn.shrink1 { font-size: 16px; padding: 12px 26px; }
.noBtn.shrink2 { font-size: 12px; padding: 9px 18px; }
.noBtn.shrink3 { font-size: 9px; padding: 6px 12px; }
.noBtn.gone { opacity: 0; transform: scale(0); pointer-events: none; width:0; padding:0; margin:0; }
.yesBtn.grow1 { font-size: 24px; padding: 18px 42px; }
.yesBtn.grow2 { font-size: 30px; padding: 22px 50px; }
.yesBtn.grow3 { font-size: 38px; padding: 26px 60px; }

.reactionText {
  margin-top: 22px; font-size: 15px; color: white; font-weight: bold;
  text-shadow: 0 2px 6px rgba(0,0,0,0.2); min-height: 22px;
  opacity: 0; transition: opacity 0.4s ease;
}
.reactionText.show { opacity: 1; }

.finalWrap { display:none; flex-direction: column; align-items: center; margin-top: 10px; }
.finalWrap.show { display: flex; animation: finalIn 0.6s cubic-bezier(0.34,1.5,0.64,1); }
@keyframes finalIn { from { opacity:0; transform: scale(0.5); } to { opacity:1; transform: scale(1); } }
.meToo {
  font-size: 34px; font-weight: 900; color: white;
  text-shadow: 0 4px 14px rgba(0,0,0,0.3);
  margin-top: 14px;
}
.chatBtn {
  display: block; margin-top: 22px;
  background: linear-gradient(135deg, #ffd166, #fa9d3a);
  color: white; text-decoration: none; font-size: 17px; font-weight: bold;
  padding: 15px 34px; border-radius: 40px;
  box-shadow: 0 10px 24px rgba(250,157,58,0.5);
  border: 2px solid rgba(255,255,255,0.7);
  opacity: 0; transform: scale(0.6);
  animation: chatBtnIn 0.7s cubic-bezier(0.34,1.5,0.64,1) forwards 0.4s;
}
@keyframes chatBtnIn { to { opacity: 1; transform: scale(1); } }
.confetti-piece2 { position: fixed; top: -5%; width: 8px; height: 14px; z-index: 3000; pointer-events: none; animation: confettiFall2 linear forwards; }
@keyframes confettiFall2 { to { transform: translateY(112vh) rotate(720deg); opacity: 0.2; } }
</style>
</head>
<body>

<div id="heartsContainer"></div>
<a href="memories.html" class="backBtn">→ رجوع</a>

<div class="scene">
  <div class="bunnyBig" id="bunnyBig">
    <div class="bb-ear left"></div>
    <div class="bb-ear right"></div>
    <div class="bb-head"></div>
    <div class="bb-eye left" id="eyeL"></div>
    <div class="bb-eye right" id="eyeR"></div>
    <div class="bb-blush left"></div>
    <div class="bb-blush right"></div>
    <div class="bb-nose"></div>
    <div class="bb-mouth" id="bbMouth"></div>
  </div>

  <div class="question">تحبيني؟ 😁</div>

  <div class="btnRow" id="btnRow">
    <button class="answerBtn noBtn" id="noBtn" onclick="pressNo()">NO</button>
    <button class="answerBtn yesBtn" id="yesBtn" onclick="pressYes()">YES</button>
  </div>

  <div class="reactionText" id="reactionText"></div>

  <div class="finalWrap" id="finalWrap">
    <div class="meToo">Me too 💗</div>
    <a href="chatlock.html" class="chatBtn" id="chatBtnEl">💌 راسلني</a>
  </div>
</div>

<script>
function createHearts() {
  const container = document.getElementById('heartsContainer');
  const hearts = ['💖','💕','💗','💓','❤️'];
  setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
    heart.style.fontSize = (Math.random() * 14 + 14) + 'px';
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }, 500);
}
createHearts();

const faces = [
  { eyeClass: '', mouthClass: '' },
  { eyeClass: 'happy', mouthClass: 'big' },
  { eyeClass: '', mouthClass: 'big' },
  { eyeClass: 'happy', mouthClass: '' }
];
let faceIdx = 0;
setInterval(() => {
  faceIdx = (faceIdx + 1) % faces.length;
  const f = faces[faceIdx];
  document.getElementById('eyeL').className = 'bb-eye left ' + f.eyeClass;
  document.getElementById('eyeR').className = 'bb-eye right ' + f.eyeClass;
  document.getElementById('bbMouth').className = 'bb-mouth ' + f.mouthClass;
}, 1400);

const noPhrases = [
  'متأكدة؟ 🥺',
  'أعرف إنچ ضغطتي بالغلط 😏',
  'خليني أساعدچ... جربي تاني 👀',
  'حاولي مرة ثانية 😌',
  'بصراحة ما راح أقبل NO 😂'
];
let noStage = 0;
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const reactionText = document.getElementById('reactionText');

function showReaction(text) {
  reactionText.classList.remove('show');
  setTimeout(() => {
    reactionText.textContent = text;
    reactionText.classList.add('show');
  }, 150);
}

function pressNo() {
  noStage++;
  showReaction(noPhrases[Math.min(noStage-1, noPhrases.length-1)]);

  if (noStage === 1) { noBtn.classList.add('shrink1'); yesBtn.classList.add('grow1'); }
  else if (noStage === 2) { noBtn.classList.remove('shrink1'); noBtn.classList.add('shrink2'); yesBtn.classList.remove('grow1'); yesBtn.classList.add('grow2'); }
  else if (noStage === 3) { noBtn.classList.remove('shrink2'); noBtn.classList.add('shrink3'); yesBtn.classList.remove('grow2'); yesBtn.classList.add('grow3'); }
  else { noBtn.classList.add('gone'); }
}

function pressYes() {
  showReaction('عرفت إنچ راح تختاريني 💕');
  document.getElementById('btnRow').style.display = 'none';
  reactionText.classList.remove('show');
  document.getElementById('finalWrap').classList.add('show');
  burstConfetti();
}

function burstConfetti() {
  const colors = ['#fa709a','#ffd166','#06d6a0','#a78bfa','#ffffff','#ff9eb8'];
  for (let i=0;i<50;i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece2';
    piece.style.left = Math.random()*100 + '%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (Math.random()*2 + 2.5) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}
</script>
</body>
  </html>
